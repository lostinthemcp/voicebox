<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VoiceBox</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="side-left">
<div id="app">
  <div id="msgrow">
    <button id="speak" class="speak">SPEAK</button>
    <button id="back" aria-label="Backspace">&#9003;</button>
    <button id="clear">CLEAR</button>
    <div id="msg" aria-live="polite"></div>
    <label id="volbox" title="Volume"><span class="volicon"><span aria-hidden="true">&#128266;</span><span id="volpct">100%</span></span><input id="vol" type="range" min="50" max="100" step="5" value="100" aria-label="Volume"></label>
    <div id="battery" hidden></div>
    <button id="gear" class="hold gear" aria-label="Settings (hold 3 seconds)"><span class="fill"></span><span class="label">&#9881;</span></button>
  </div>
  <div id="body">
    <aside id="controls">
      <button id="yes" class="yes">YES</button>
      <button id="no" class="no">NO</button>
      <button id="notsure" class="notsure">NOT SURE</button>
      <button id="holdon" class="holdon">HOLD ON</button>
      <button id="home" class="home">&#8962; HOME</button>
      <button id="help" class="hold help"><span class="fill"></span><span class="label">HOLD FOR HELP</span></button>
    </aside>
    <main>
      <div id="lastsaid"></div>
      <section id="panel"></section>
    </main>
  </div>
</div>

<div id="settings" hidden>
  <div class="shead"><h1>Settings <span class="small">(for family)</span></h1><div id="savenote"></div><button id="sdone" class="speak">Done</button></div>
  <div class="sgrid"><nav id="snav"></nav><div id="sbody"></div></div>
  <div id="skeys" class="keyboard" hidden></div>
</div>
<div id="modal" hidden></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
